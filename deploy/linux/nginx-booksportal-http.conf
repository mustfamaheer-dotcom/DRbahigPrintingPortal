# DR. Bahig Books Portal - nginx reverse proxy - PHASE 1 (IP / HTTP only)
# Used when no domain is attached yet: server answers on its public IP over HTTP.
# When the domain + SSL certificate are ready, run enable-https.sh which swaps
# this for nginx-booksportal.conf (HTTPS) and flips the app security settings.

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_IP;

    # PDFs can be large (book files)
    client_max_body_size 200m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Blazor Server / SignalR long-lived connections
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SignalR WebSocket hub - must be upgraded, not buffered
    location /hubs/print {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
